version: '3.8'

services:
  # Ollama service
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # FastAPI backend
  api:
    build: .
    container_name: rag-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - VECTOR_STORE_TYPE=faiss
      - DEFAULT_LANGUAGE=en
    volumes:
      - ./vector_store:/app/vector_store
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000

  # Streamlit UI
  ui:
    build: .
    container_name: rag-ui
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - VECTOR_STORE_TYPE=faiss
      - DEFAULT_LANGUAGE=en
    volumes:
      - ./vector_store:/app/vector_store
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped
    command: streamlit run src/ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  ollama_data:
